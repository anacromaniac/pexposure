[package]
name = "pexposure"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Look-through portfolio allocation report for leveraged and mixed instruments"
repository = "https://github.com/anacromaniac/pexposure"
homepage = "https://github.com/anacromaniac/pexposure"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
itertools = "0.14"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
